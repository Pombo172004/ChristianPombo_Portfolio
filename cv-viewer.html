<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Christian Dave E. Pombo - CV</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #071114; }
    .viewer { position: relative; width: 100%; height: 100%; }
    .viewer iframe { width: 100%; height: 100%; border: 0; }
    .viewer-note { position: fixed; z-index: 2; top: 12px; left: 50%; padding: 8px 14px; border: 1px solid rgba(97, 245, 210, .35); border-radius: 999px; color: #b7d4d1; background: rgba(7, 17, 20, .88); font: 12px Arial, sans-serif; transform: translateX(-50%); }
    @media print { body { display: none !important; } }
  </style>
</head>
<body>
  <div class="viewer">
    <div class="viewer-note">CV preview · downloading and printing are disabled where supported</div>
    <iframe src="cv.pdf#toolbar=0&navpanes=0&scrollbar=0&view=FitH" title="CV preview"></iframe>
  </div>
  <script>
    document.addEventListener("contextmenu", (event) => event.preventDefault());
    document.addEventListener("dragstart", (event) => event.preventDefault());
    document.addEventListener("keydown", (event) => {
      if ((event.ctrlKey || event.metaKey) && ["s", "p", "u"].includes(event.key.toLowerCase())) {
        event.preventDefault();
      }
    });
  </script>
</body>
</html>
